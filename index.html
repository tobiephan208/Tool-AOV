<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông báo chuyển tên miền</title>
    <meta http-equiv="refresh" content="5;url=https://vtt-tool.netlify.app/">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            color: #222222;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .title {
            font-size: 1.1rem;
            font-weight: 500;
            color: #555555;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .url-link {
            display: inline-block;
            font-size: 1.25rem;
            font-weight: 600;
            color: #0066cc;
            text-decoration: none;
            word-break: break-all;
            margin-bottom: 24px;
            padding: 8px 16px;
            background-color: #f5f7fa;
            border-radius: 8px;
            transition: background-color 0.2s ease;
        }

        .url-link:hover {
            background-color: #e8eeea;
            text-decoration: underline;
        }

        .countdown {
            font-size: 0.95rem;
            color: #777777;
        }

        .seconds {
            font-weight: 600;
            color: #222222;
        }
    </style>
</head>
<body>

    <div class="container">
        <p class="title">Tên miền này đã ngưng hoạt động, vui lòng chuyển sang tên miền mới:</p>
        <a href="https://vtt-tool.netlify.app/" class="url-link">https://vtt-tool.netlify.app/</a>
        <p class="countdown">Chúng tôi sẽ tự động đưa bạn qua sau <span id="timer" class="seconds">5</span> giây</p>
    </div>

    <script>
        let timeLeft = 5;
        const timerElement = document.getElementById('timer');

        const countdownInterval = setInterval(() => {
            timeLeft--;
            if (timeLeft >= 0) {
                timerElement.textContent = timeLeft;
            } else {
                clearInterval(countdownInterval);
                window.location.href = "https://vtt-tool.netlify.app/";
            }
        }, 1000);
    </script>

</body>
</html>
